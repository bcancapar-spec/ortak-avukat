name: CI

# ── RELEASE KAPISI — yeşil ne demek, ne DEMEZ ────────────────────────────────
#
# YEŞİL = "aile yapısı sağlam + teslim zincirinin MANTIĞI dört platformda
#          (Ubuntu/Windows × py3.12/3.13) ayakta."
#
# YEŞİL ≠ "UDF hattı çalışıyor." Koşucularda `npx` VAR ama `udf-cli` OTURUMU
# YOKTUR (`~/.config/yargi/token.json`); udf_yaz.py ise v0.5.5.1'den beri
# bilinçli FAIL-CLOSED'dur (yerel motor KALDIRILDI — ürettiği .udf UYAP'ta
# açılmıyordu). Bu yüzden GERÇEK .udf üretimini iddia eden testler burada
# GÖRÜNÜR gerekçeyle atlanır ve zincir testleri `--udf-yok` kipinde koşar.
# Ayrıntı ve disiplin gerekçesi: tests/oa_udf_ortam.py.
# UDF hattı YALNIZ avukatın kendi makinesinde (oturum açık) ve sahada
# doğrulanır. `-rs` bayrağı atlananları her koşuda listeler — sessiz atlama YOK.
#
# OCR BACAĞI (v0.5.14 / denetim bulgusu B-39): matris koşucularında Tesseract
# YOKTUR, bu yüzden uçtan uca OCR testleri `test` işinde GÖRÜNÜR gerekçeyle
# atlanır. Bu bacak artık ayrı bir işte (`ocr`) Ubuntu üzerinde tesseract-ocr
# + tesseract-ocr-tur kurularak GERÇEKTEN koşar. Yani `test` işinin yeşili
# "OCR çalışıyor" DEMEZ; onu söyleyen `ocr` işidir.
#
# İki iş AYRI tutulur: `yapi` işi `test` işine bağlı DEĞİLDİR. (2026-08-06
# bulgusu: yapı denetimi pytest'in ARKASINDA bir ADIM olduğu için, testler
# kırmızıya döndüğü 11 koşu boyunca HİÇ çalışamadı — bir kapı, başka bir
# kapının arkasına saklanmamalı.)

on:
  push:
    branches: [main, master]
    # v0.5.14 / B-39: RELEASE KAPISI, release'in KESİLDİĞİ olayda da
    # ateşlemelidir. Etiket tetiği yokken `v*` push'u CI'yı hiç çalıştırmıyordu
    # (main push'u yalnız KISMEN telafi ediyordu: etiket başka bir commit'e
    # atılabilir).
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # v0.5.16.3: pip önbelleği YOKTU — her koşuda 5 iş × ~35 MB tekerlek
          # yeniden indiriliyordu (pymupdf+pillow başlıca yük).
          cache: pip

      # pytest-xdist BİLİNÇLİ OLARAK requirements.txt'e KONMADI: o dosyanın
      # başlığı "çalışma zamanı + test bağımlılıkları" diyor ve avukatın kendi
      # makinesinde de `pip install -r requirements.txt` koşuyor — son
      # kullanıcıya paralel test koşucusu yüklemek gereksiz bir bağımlılıktır.
      # Yalnızca CI burada kurar. (`pytest` requirements.txt:6'da zaten var;
      # eski satırdaki fazladan `pytest` argümanı da kaldırıldı.)
      - name: Install dependencies
        run: pip install -r requirements.txt pytest-xdist

      # -rsfE: atlanan her test GEREKÇESİYLE + düşen her test ADIYLA listelenir.
      # (Ders: yalın `-rs`, pytest'in varsayılan başarısızlık özetini SUSTURUR —
      # v0.5.7 koşusunda 10 kırmızının adları özetten kaybolmuştu.)
      #
      # -n auto (v0.5.16.3): süit paralel-güvenli ÖLÇÜLDÜ — seri 259.1 s vs
      # `-n auto` 42.6 s (4 çekirdek) ve iki koşuda bilanço BİREBİR aynı,
      # yani sıra-bağımlı çakışma yok ve kırmızılar paralelde GİZLENMİYOR.
      # Kod delili: tests/ altında `chdir` yok, testler kendi `tmp_path`
      # köklerinde çalışıyor.
      #
      # DÖRT BACAKTA DOĞRULANDI (koşu 34522778869, commit 553a448):
      #   ubuntu py3.12  : 4 failed, 2318 passed, 15 skipped —  81.01 s
      #   windows py3.12 : 4 failed, 2318 passed, 15 skipped — 123.87 s (gw1 win32)
      # Bilanço yerel seri koşumla BİREBİR aynı; Windows'ta `msvcrt`
      # kilitleme ile paralel işçiler arasında çakışma ÇIKMADI (işçiler ayrı
      # `tmp_path` köklerinde çalışıyor). README'nin "~7 dk (Windows)"
      # ölçümüne göre Windows bacağı ~2 dk'ya indi.
      # Bir gün sıra-bağımlı kırmızı çıkarsa çözüm `-n auto`yu o platformda
      # kaldırmaktır — test SUSTURMAK değil.
      - name: Run tests
        run: pytest -rsfE -n auto -m "not perf"

      # v0.5.17 — ZAMANLAMA TESTLERİ AYRI VE SERİ. Gerekçe: paralel işçiler
      # birbirinin süre ölçümünü kirletir (eski oran tabanlı test tam süit
      # yükü altında tersine dönüyordu: 203.3 vs 194.6 ms). Bu adım KAPIDIR —
      # kırmızısı bacağı düşürür; yalnızca YALNIZ koşar.
      - name: Zamanlama testleri (seri — perf markası)
        run: pytest -rsfE -m perf -p no:xdist

  yapi:
    name: aile yapı denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Family structure gate (aile yapı denetimi)
        run: python plugins/ortak-avukat/skills/oa-usta/scripts/aile_dogrula.py plugins/ortak-avukat/skills

  ocr:
    # v0.5.14 / B-39: OCR bacağı hiçbir platformda koşmuyordu — üç uçtan uca
    # test her koşuda `skipif(TESSERACT_YOK)` ile sessizce atlanıyordu. Ayrı
    # bir iş (matrisi ve süresini şişirmesin diye tek platform/tek Python) ve
    # `-rsfE` ile: atlanan varsa GEREKÇESİYLE görünür.
    name: OCR bacağı (Ubuntu / tesseract-tur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Tesseract (Türkçe dil paketiyle)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tur

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bu iş TEK bir test dosyası koşuyor — `-n auto` burada işçi başlatma
      # maliyetini kazançtan büyük yapar, o yüzden SERİ kalır.
      - name: OCR testleri (gerçek tesseract ile)
        run: pytest -rsfE tests/test_oa_ingest_ocr_nobetci.py
